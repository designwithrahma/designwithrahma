<svg
    xmlns="http://www.w3.org/2000/svg"
    width="720"
    height="560"
    viewBox="0 0 720 560"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Rahmathullah profile information</title>

    <desc id="description">
        An animated terminal-style profile card for Mohammed Rahmathullah.
    </desc>

    <defs>
        <linearGradient
            id="panel-border"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop offset="0%" stop-color="#58a6ff"/>
            <stop offset="50%" stop-color="#8b949e"/>
            <stop offset="100%" stop-color="#3fb950"/>
        </linearGradient>
    </defs>

    <style>
        .panel {
            fill: #0d1117;
            stroke: url(#panel-border);
            stroke-width: 2;
        }

        .top-bar {
            fill: #161b22;
        }

        .terminal-title,
        .prompt,
        .label,
        .separator,
        .value {
            font-family:
                "Cascadia Code",
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;
        }

        .terminal-title {
            fill: #8b949e;
            font-size: 17px;
            font-weight: 600;
        }

        .prompt {
            fill: #3fb950;
            font-size: 22px;
            font-weight: 700;
            opacity: 0;
            animation: reveal 0.35s ease forwards;
            animation-delay: 0.15s;
        }

        .cursor {
            fill: #58a6ff;
            animation: blink 0.9s steps(2, start) infinite;
        }

        .info-row {
            opacity: 0;
            transform: translateX(-12px);
            animation: reveal-row 0.4s ease-out forwards;
        }

        .label {
            fill: #8b949e;
            font-size: 17px;
            font-weight: 600;
        }

        .separator {
            fill: #58a6ff;
            font-size: 17px;
            font-weight: 700;
        }

        .value {
            fill: #c9d1d9;
            font-size: 17px;
            font-weight: 600;
        }

        .footer {
            fill: #6e7681;
            font-family:
                "Cascadia Code",
                "SFMono-Regular",
                Consolas,
                monospace;
            font-size: 14px;
            opacity: 0;
            animation: reveal 0.4s ease forwards;
            animation-delay: 1.8s;
        }

        @keyframes reveal {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes reveal-row {
            from {
                opacity: 0;
                transform: translateX(-12px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes blink {
            0%,
            45% {
                opacity: 1;
            }

            46%,
            100% {
                opacity: 0;
            }
        }

        @media (prefers-color-scheme: light) {
            .panel {
                fill: #ffffff;
            }

            .top-bar {
                fill: #f6f8fa;
            }

            .terminal-title,
            .label {
                fill: #57606a;
            }

            .value {
                fill: #24292f;
            }

            .footer {
                fill: #6e7781;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .prompt,
            .info-row,
            .footer {
                opacity: 1;
                transform: none;
                animation: none;
            }

            .cursor {
                animation: none;
            }
        }
    </style>

    <rect
        class="panel"
        x="1"
        y="1"
        width="718"
        height="558"
        rx="18"
    />

    <path
        class="top-bar"
        d="
            M 19 1
            H 701
            Q 719 1 719 19
            V 62
            H 1
            V 19
            Q 1 1 19 1
            Z
        "
    />

    <circle cx="28" cy="31" r="7" fill="#ff5f56"/>
    <circle cx="52" cy="31" r="7" fill="#ffbd2e"/>
    <circle cx="76" cy="31" r="7" fill="#27c93f"/>

    <text
