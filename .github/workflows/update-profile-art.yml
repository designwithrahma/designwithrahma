name: Update Profile Art

on:
  schedule:
    - cron: "17 6 * * *"
      timezone: "Asia/Colombo"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: true

jobs:
  refresh-profile:
    name: Refresh contribution artwork
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Fetch GitHub contributions
        run: python scripts/fetch_contributions.py

      - name: Render contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit updated contribution artwork
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/contributions.json contrib-heatmap.svg)" ]; then
            echo "No contribution changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/contributions.json contrib-heatmap.svg
          git commit -m "chore: refresh contribution graph"
          git push