<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Designwithrahma — Creative Developer and Designer</title>
  <desc id="desc">Creative operating-system style header for Designwithrahma.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity=".15"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#30363d"/>

  <g stroke="#ffffff" stroke-opacity=".035">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/>
    <path d="M100 0V420M200 0V420M300 0V420M400 0V420M500 0V420M600 0V420M700 0V420M800 0V420M900 0V420M1000 0V420M1100 0V420"/>
  </g>

  <circle cx="34" cy="30" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="30" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="30" r="6" fill="#27c93f"/>
  <text x="600" y="35" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7d8590">designwithrahma / creative-os</text>

  <text x="70" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7d8590">rahma@github ~ $ launch profile</text>
  <text x="70" y="188" font-family="Inter, system-ui, sans-serif" font-size="58" font-weight="750" fill="#f0f6fc">DESIGNWITHRAHMA</text>
  <rect x="70" y="214" width="735" height="3" rx="2" fill="url(#line)" filter="url(#glow)"/>
  <text x="70" y="268" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="600" fill="#c9d1d9">Creative Developer / Designer</text>
  <text x="70" y="308" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#8b949e">Interfaces · Web · Visual Identity · Digital Experiments</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <rect x="70" y="342" width="170" height="42" rx="11" fill="#161b22" stroke="#30363d"/>
    <circle cx="91" cy="363" r="5" fill="#3fb950">
      <animate attributeName="opacity" values="1;.35;1" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <text x="107" y="369" fill="#c9d1d9">available / building</text>

    <rect x="255" y="342" width="185" height="42" rx="11" fill="#161b22" stroke="#30363d"/>
    <text x="277" y="369" fill="#c9d1d9">Batticaloa · LK</text>

    <rect x="455" y="342" width="205" height="42" rx="11" fill="#161b22" stroke="#30363d"/>
    <text x="477" y="369" fill="#58a6ff">designwithrahma.io</text>
  </g>

  <g transform="translate(938,103)">
    <rect x="0" y="0" width="190" height="190" rx="42" fill="#0d1117" stroke="#30363d"/>
    <path d="M44 62h49c33 0 53 17 53 45 0 18-9 32-25 39l30 39h-31l-25-34H72v34H44V62zm28 26v39h18c17 0 27-7 27-20s-10-19-27-19H72z" fill="#f0f6fc"/>
    <rect x="155" y="62" width="9" height="123" rx="4.5" fill="#58a6ff"/>
    <circle cx="159.5" cy="49" r="6" fill="#3fb950">
      <animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="1033" y="323" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7d8590">DESIGN × CODE</text>
  <rect x="0" y="408" width="1200" height="12" fill="#0b0f14"/>
