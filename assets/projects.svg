<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Selected work by Designwithrahma</title>
  <desc id="desc">Four project cards for MONO//SHIFT, EchoRoom, DropRoom and Nexplan.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="610" rx="24" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="608" rx="23" fill="none" stroke="#30363d"/>
  <text x="50" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#7d8590">rahma@github ~ $ ls ./selected-work --featured</text>
  <text x="50" y="100" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="#f0f6fc">Selected Work</text>
  <text x="50" y="130" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#8b949e">Design, code and experiments currently shaping the lab.</text>

  <g transform="translate(50 165)">
    <rect width="535" height="175" rx="18" fill="url(#card)" stroke="#30363d"/>
    <text x="24" y="34" font-family="ui-monospace, monospace" font-size="13" fill="#58a6ff">01 / SHIPPED</text>
    <text x="24" y="76" font-family="Inter, system-ui" font-size="28" font-weight="700" fill="#f0f6fc">MONO//SHIFT</text>
    <text x="24" y="108" font-family="Inter, system-ui" font-size="15" fill="#8b949e">Monochrome skill-based web game</text>
    <text x="24" y="140" font-family="ui-monospace, monospace" font-size="13" fill="#c9d1d9">WEB GAME · INTERACTION · EXPERIMENT</text>
    <circle cx="505" cy="30" r="6" fill="#3fb950"/>
  </g>

  <g transform="translate(615 165)">
    <rect width="535" height="175" rx="18" fill="url(#card)" stroke="#30363d"/>
    <text x="24" y="34" font-family="ui-monospace, monospace" font-size="13" fill="#58a6ff">02 / SHIPPED</text>
    <text x="24" y="76" font-family="Inter, system-ui" font-size="28" font-weight="700" fill="#f0f6fc">EchoRoom</text>
    <text x="24" y="108" font-family="Inter, system-ui" font-size="15" fill="#8b949e">Temporary real-time text rooms</text>
    <text x="24" y="140" font-family="ui-monospace, monospace" font-size="13" fill="#c9d1d9">REALTIME · PRIVACY · WEB</text>
    <circle cx="505" cy="30" r="6" fill="#3fb950"/>
  </g>

  <g transform="translate(50 365)">
    <rect width="535" height="175" rx="18" fill="url(#card)" stroke="#30363d"/>
    <text x="24" y="34" font-family="ui-monospace, monospace" font-size="13" fill="#58a6ff">03 / SHIPPED</text>
    <text x="24" y="76" font-family="Inter, system-ui" font-size="28" font-weight="700" fill="#f0f6fc">DropRoom</text>
    <text x="24" y="108" font-family="Inter, system-ui" font-size="15" fill="#8b949e">Browser-to-browser file transfer</text>
    <text x="24" y="140" font-family="ui-monospace, monospace" font-size="13" fill="#c9d1d9">WEBRTC · P2P · TRANSFER</text>
    <circle cx="505" cy="30" r="6" fill="#3fb950"/>
  </g>

  <g transform="translate(615 365)">
    <rect width="535" height="175" rx="18" fill="url(#card)" stroke="#30363d"/>
    <text x="24" y="34" font-family="ui-monospace, monospace" font-size="13" fill="#d29922">04 / BUILDING</text>
    <text x="24" y="76" font-family="Inter, system-ui" font-size="28" font-weight="700" fill="#f0f6fc">Nexplan</text>
    <text x="24" y="108" font-family="Inter, system-ui" font-size="15" fill="#8b949e">Local-first personal productivity system</text>
    <text x="24" y="140" font-family="ui-monospace, monospace" font-size="13" fill="#c9d1d9">PRODUCTIVITY · SYSTEMS · UX</text>
    <circle cx="505" cy="30" r="6" fill="#d29922">
      <animate attributeName="opacity" values="1;.35;1" dur="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
